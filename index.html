<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher's Tally Pro</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#6200EE">
    <link rel="apple-touch-icon" href="./icon-192.png">
    
    <!-- Google Fonts: Montserrat & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Montserrat', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6200EE',
                        'primary-dark': '#3700B3',
                        secondary: '#03DAC6',
                        background: '#F5F5F6',
                        surface: '#FFFFFF',
                        error: '#B00020'
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide arrows on number inputs (for inline editing) */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        /* Material Ripple Effect Setup */
        .ripple {
            background-position: center;
            transition: background 0.5s;
        }
        .ripple:hover {
            background: #ffffff22 radial-gradient(circle, transparent 1%, #ffffff22 1%) center/15000%;
        }
        .ripple:active {
            background-color: #ffffff44;
            background-size: 100%;
            transition: background 0s;
        }

        /* Numpad Active Animation */
        .numpad-btn:active {
            transform: scale(0.95);
            background-color: #E5E7EB; /* Tailwind gray-200 */
        }
    </style>
</head>
<body class="bg-background text-gray-900 h-[100dvh] flex flex-col overflow-hidden select-none">

    <!-- Material App Bar -->
    <header class="fixed top-0 left-0 right-0 w-full bg-primary text-white shadow-md z-50 flex justify-between items-center px-4 h-[64px]">
        <div class="flex items-center gap-2">
            <span class="material-symbols-rounded text-3xl">calculate</span>
            <h1 class="text-xl font-medium tracking-wide">Tally Pro</h1>
        </div>
        <div class="flex items-center gap-2">
            
            <!-- Dynamic Timing Selector with Custom Option -->
            <div class="relative flex items-center bg-white/10 rounded-full hover:bg-white/20 transition-colors shadow-inner" title="Set Auto-Add Speed">
                <select id="timer-delay-select" class="bg-transparent text-white text-sm font-bold outline-none appearance-none cursor-pointer pl-4 pr-7 py-1.5 relative z-10 min-w-[70px]">
                    <option value="500" class="text-gray-900 font-medium" selected>0.5s</option>
                    <option value="1000" class="text-gray-900 font-medium">1s</option>
                    <option value="2000" class="text-gray-900 font-medium">2s</option>
                    <option value="3000" class="text-gray-900 font-medium">3s</option>
                    <option value="custom" class="text-gray-900 font-medium italic">Custom...</option>
                </select>
                <span class="material-symbols-rounded text-[18px] absolute right-2 pointer-events-none opacity-80">arrow_drop_down</span>
            </div>

            <!-- Single prominent clear button for new calculations -->
            <button id="clear-btn" class="p-2 rounded-full bg-error/80 hover:bg-error active:bg-error/90 transition-colors flex items-center justify-center disabled:opacity-50 disabled:bg-transparent disabled:text-white/50" title="Clear All Marks (New Tally)">
                <span class="material-symbols-rounded">delete_sweep</span>
            </button>
        </div>
    </header>

    <!-- Scrollable List Area -->
    <main id="list-container" class="flex-1 overflow-y-auto p-4 space-y-3 mt-[64px]">
        <!-- Empty State -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-gray-400">
            <span class="material-symbols-rounded text-6xl mb-2 opacity-50">post_add</span>
            <p class="text-center font-medium">No marks yet.<br/>Type below to start.</p>
        </div>
        <!-- Entries will be injected here -->
    </main>

    <!-- Bottom Action Area (Sticky at the bottom) -->
    <footer class="bg-surface shadow-[0_-8px_20px_rgba(0,0,0,0.06)] z-20 shrink-0 relative flex flex-col pb-safe">
        
        <!-- Grand Total Card -->
        <div class="px-5 py-3 border-b border-gray-100 flex justify-between items-end bg-indigo-50/30">
            <div>
                <p class="text-xs font-bold text-gray-500 uppercase tracking-widest" id="paper-count">Papers: 0</p>
                <p class="text-sm font-medium text-gray-600 mt-0.5">Grand Total</p>
            </div>
            <div class="text-4xl font-extrabold text-primary tracking-tight" id="grand-total">
                0
            </div>
        </div>

        <!-- Timer Progress Indicator -->
        <div class="w-full h-1.5 bg-gray-200 overflow-hidden shrink-0">
            <div id="timer-bar" class="h-full bg-secondary w-0 origin-left"></div>
        </div>

        <!-- Input Section (Digital Display Style) -->
        <div class="px-4 pt-4 pb-2 flex gap-3 max-w-md w-full mx-auto items-center">
            <div class="relative flex-1">
                <input
                    id="mark-input"
                    type="text"
                    readonly
                    placeholder="0"
                    class="w-full bg-indigo-50/60 border-2 border-primary/20 rounded-2xl px-4 py-3 text-4xl font-bold text-primary text-center focus:outline-none transition-colors shadow-inner tracking-wider"
                />
            </div>
            
            <!-- Manual Add Button -->
            <button 
                id="add-btn"
                class="bg-primary text-white rounded-2xl w-[72px] h-[64px] flex items-center justify-center shadow-md active:shadow-sm active:translate-y-[1px] disabled:opacity-50 disabled:bg-gray-400 transition-all ripple shrink-0"
                disabled
            >
                <span class="material-symbols-rounded text-4xl">add</span>
            </button>
        </div>

        <!-- Custom Numpad Grid -->
        <div class="px-4 pb-4 pt-1 grid grid-cols-3 gap-2 max-w-md w-full mx-auto">
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="1">1</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="2">2</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="3">3</button>
            
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="4">4</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="5">5</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="6">6</button>
            
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="7">7</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="8">8</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="9">9</button>
            
            <button class="numpad-btn bg-gray-50 border border-gray-200 shadow-sm rounded-2xl h-[56px] text-3xl font-bold text-gray-800 transition-transform" data-val=".">.</button>
            <button class="numpad-btn bg-white border border-gray-200 shadow-sm rounded-2xl h-[56px] text-2xl font-bold text-gray-800 transition-transform" data-val="0">0</button>
            <button class="numpad-btn bg-red-50 border border-red-100 shadow-sm rounded-2xl h-[56px] text-error flex items-center justify-center transition-transform" data-val="backspace">
                <span class="material-symbols-rounded text-2xl pointer-events-none">backspace</span>
            </button>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- State ---
        let entries = [];
        let autoAddTimeout = null;
        let autoAddDelay = 500; // Default to 0.5 seconds (500ms)
        let editingId = null;

        // --- DOM Elements ---
        const input = document.getElementById('mark-input');
        const addBtn = document.getElementById('add-btn');
        const listContainer = document.getElementById('list-container');
        const emptyState = document.getElementById('empty-state');
        const grandTotalEl = document.getElementById('grand-total');
        const paperCountEl = document.getElementById('paper-count');
        const timerBar = document.getElementById('timer-bar');
        const timerDelaySelect = document.getElementById('timer-delay-select');
        const clearBtn = document.getElementById('clear-btn');
        const numpadBtns = document.querySelectorAll('.numpad-btn');

        // --- Initialization ---
        renderList(); 

        // --- Numpad Logic ---
        numpadBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                // Ignore numpad if we are in inline-editing mode
                if (editingId !== null) return; 

                // Haptic feedback for supported devices
                if (navigator.vibrate) navigator.vibrate(20);

                const val = btn.dataset.val;

                if (val === 'backspace') {
                    input.value = input.value.slice(0, -1);
                } else if (val === '.') {
                    if (!input.value.includes('.')) {
                        input.value += input.value === '' ? '0.' : '.';
                    }
                } else {
                    // Prevent giant numbers
                    if (input.value.length < 6) {
                        input.value += val;
                    }
                }

                // Trigger the logic to evaluate the new value
                handleInput();
            });
        });

        // --- Physical Keyboard Fallback (for PC/Tablets) ---
        document.addEventListener('keydown', (e) => {
            // Ignore if inline-editing (let the native input handle it)
            if (editingId !== null) return;

            const key = e.key;
            if (/[0-9]/.test(key)) {
                if (input.value.length < 6) {
                    input.value += key;
                    handleInput();
                }
            } else if (key === '.') {
                if (!input.value.includes('.')) {
                    input.value += input.value === '' ? '0.' : '.';
                    handleInput();
                }
            } else if (key === 'Backspace') {
                input.value = input.value.slice(0, -1);
                handleInput();
            } else if (key === 'Enter' || key === ' ') {
                e.preventDefault();
                addMark();
            }
        });

        // --- Event Listeners ---
        addBtn.addEventListener('click', addMark);
        clearBtn.addEventListener('click', clearAll);
        
        // Listen for user changing the delay timer speed
        timerDelaySelect.addEventListener('change', (e) => {
            if (e.target.value === 'custom') {
                const userVal = prompt("Enter custom timer in seconds (e.g., 0.8, 1.5):");
                if (userVal !== null && userVal.trim() !== '') {
                    const parsedSecs = parseFloat(userVal);
                    if (!isNaN(parsedSecs) && parsedSecs >= 0.1) {
                        const newDelayMs = Math.round(parsedSecs * 1000);
                        autoAddDelay = newDelayMs;
                        
                        // Check if option already exists, if not create it
                        let optionExists = Array.from(timerDelaySelect.options).some(opt => opt.value == newDelayMs);
                        if (!optionExists) {
                            const newOpt = document.createElement('option');
                            newOpt.value = newDelayMs;
                            newOpt.text = parsedSecs + 's';
                            newOpt.className = "text-gray-900 font-medium";
                            timerDelaySelect.insertBefore(newOpt, timerDelaySelect.querySelector('option[value="custom"]'));
                        }
                        timerDelaySelect.value = newDelayMs;
                    } else {
                        alert("Invalid number. Please enter a valid seconds value (min 0.1).");
                        timerDelaySelect.value = autoAddDelay; // Revert back
                    }
                } else {
                    timerDelaySelect.value = autoAddDelay; // Revert back if cancelled
                }
            } else {
                autoAddDelay = parseInt(e.target.value);
            }
            
            // If currently typing, restart timer with new delay immediately
            if (input.value !== '') {
                clearAutoTimer();
                startAutoTimer();
            }
        });

        // --- Core Functions ---

        function handleInput() {
            const val = input.value;
            addBtn.disabled = val === '';

            // Reset Timer whenever user types
            clearAutoTimer();

            // Only start timer if there is a valid number (not just a lonely decimal point)
            if (val !== '' && val !== '.') {
                startAutoTimer();
            }
        }

        function startAutoTimer() {
            // Reset CSS animation
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            
            // Force browser reflow to restart animation seamlessly
            void timerBar.offsetWidth; 
            
            // Set dynamic transition duration based on user selection
            timerBar.style.transition = `width ${autoAddDelay}ms linear`;
            timerBar.style.width = '0%';

            // Start Countdown
            autoAddTimeout = setTimeout(() => {
                if (input.value !== '') {
                    addMark();
                }
            }, autoAddDelay);
        }

        function clearAutoTimer() {
            if (autoAddTimeout) {
                clearTimeout(autoAddTimeout);
                autoAddTimeout = null;
            }
            timerBar.style.transition = 'none';
            timerBar.style.width = '0%';
        }

        function addMark() {
            const markValue = parseFloat(input.value);
            
            if (!isNaN(markValue)) {
                entries.push({
                    id: Date.now(),
                    number: entries.length + 1,
                    mark: markValue
                });
                
                input.value = '';
                addBtn.disabled = true;
                clearAutoTimer();
                renderList();
            }
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            // Re-index entries to keep numbers sequential
            entries.forEach((e, index) => {
                e.number = index + 1;
            });
            renderList();
        }

        function clearAll() {
            if (entries.length === 0) return;
            if (confirm("Clear all marks and start a new calculation?")) {
                entries = [];
                input.value = '';
                addBtn.disabled = true;
                clearAutoTimer();
                renderList();
            }
        }

        // --- Inline Editing Functions ---
        function startEditing(id, currentMark) {
            // Stop active timers so we don't auto-add the numpad value while editing
            clearAutoTimer(); 
            editingId = id;
            renderList();
        }

        function saveEdit(id, newValue) {
            const markValue = parseFloat(newValue);
            if (!isNaN(markValue)) {
                const entry = entries.find(e => e.id === id);
                if(entry) entry.mark = markValue;
            }
            editingId = null;
            renderList();
        }

        function cancelEdit() {
            editingId = null;
            renderList();
        }

        // --- Rendering ---
        function renderList() {
            // Update Totals
            const total = entries.reduce((sum, e) => sum + e.mark, 0);
            grandTotalEl.innerText = total % 1 !== 0 ? total.toFixed(2) : total;
            paperCountEl.innerText = `Papers: ${entries.length}`;
            
            // Update Header Buttons
            clearBtn.disabled = entries.length === 0;

            // Clear current list
            listContainer.innerHTML = '';

            if (entries.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Render items
            entries.forEach(entry => {
                const itemDiv = document.createElement('div');
                
                if (editingId === entry.id) {
                    // Edit Mode UI
                    itemDiv.className = "flex items-center justify-between p-2 rounded-xl bg-indigo-50 border border-primary shadow-sm";
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-3 flex-1">
                            <span class="text-xs font-bold text-primary w-6">#${entry.number}</span>
                            <input 
                                type="number" 
                                inputmode="decimal"
                                value="${entry.mark}" 
                                id="edit-input-${entry.id}"
                                class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-xl font-bold text-gray-800 focus:ring-2 focus:ring-primary outline-none"
                            >
                        </div>
                        <div class="flex items-center gap-1 ml-2">
                            <button onclick="saveEdit(${entry.id}, document.getElementById('edit-input-${entry.id}').value)" class="p-2 text-green-600 hover:bg-green-100 rounded-lg transition-colors">
                                <span class="material-symbols-rounded">check</span>
                            </button>
                            <button onclick="cancelEdit()" class="p-2 text-gray-400 hover:bg-gray-200 rounded-lg transition-colors">
                                <span class="material-symbols-rounded">close</span>
                            </button>
                        </div>
                    `;
                    
                    // Auto focus and handle enter/escape for edit field
                    setTimeout(() => {
                        const editInput = document.getElementById(`edit-input-${entry.id}`);
                        editInput.focus();
                        editInput.select();
                        editInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') saveEdit(entry.id, editInput.value);
                            if (e.key === 'Escape') cancelEdit();
                        });
                    }, 10);

                } else {
                    // Normal Mode UI
                    itemDiv.className = "flex items-center justify-between p-3 rounded-xl bg-surface border border-gray-100 shadow-sm transition-all";
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-bold text-gray-400 w-6">#${entry.number}</span>
                            <span class="text-xl font-bold text-gray-800">${entry.mark}</span>
                        </div>
                        <div class="flex items-center">
                            <button onclick="startEditing(${entry.id}, ${entry.mark})" class="p-2 text-gray-400 hover:text-primary rounded-lg transition-colors">
                                <span class="material-symbols-rounded text-[20px]">edit</span>
                            </button>
                            <button onclick="deleteEntry(${entry.id})" class="p-2 text-gray-400 hover:text-error rounded-lg transition-colors">
                                <span class="material-symbols-rounded text-[20px]">delete</span>
                            </button>
                        </div>
                    `;
                }
                
                listContainer.appendChild(itemDiv);
            });

            // Auto-scroll to bottom smoothly
            listContainer.scrollTo({
                top: listContainer.scrollHeight,
                behavior: 'smooth'
            });
        }

        // --- PWA Service Worker Registration ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(registration => {
                        console.log('ServiceWorker registration successful with scope: ', registration.scope);
                    })
                    .catch(err => {
                        console.log('ServiceWorker registration failed: ', err);
                    });
            });
        }
    </script>
</body>
</html>
