<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Teacher's Tally Pro - Material</title>
    
    <!-- Google Fonts: Roboto & Material Symbols -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet" />
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Roboto', 'sans-serif'],
                    },
                    colors: {
                        primary: '#6200EE',
                        'primary-dark': '#3700B3',
                        secondary: '#03DAC6',
                        background: '#F5F5F6',
                        surface: '#FFFFFF',
                        error: '#B00020'
                    }
                }
            }
        }
    </script>
    <style>
        /* Hide arrows on number inputs */
        input[type="number"]::-webkit-inner-spin-button,
        input[type="number"]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type="number"] {
            -moz-appearance: textfield;
        }
        
        /* Material Ripple Effect Setup */
        .ripple {
            background-position: center;
            transition: background 0.5s;
        }
        .ripple:hover {
            background: #ffffff22 radial-gradient(circle, transparent 1%, #ffffff22 1%) center/15000%;
        }
        .ripple:active {
            background-color: #ffffff44;
            background-size: 100%;
            transition: background 0s;
        }
    </style>
</head>
<body class="bg-background text-gray-900 h-[100dvh] flex flex-col overflow-hidden select-none">

    <!-- Material App Bar -->
    <header class="bg-primary text-white shadow-md z-20 flex justify-between items-center px-4 py-3 shrink-0">
        <div class="flex items-center gap-3">
            <span class="material-symbols-rounded text-3xl">calculate</span>
            <h1 class="text-xl font-medium tracking-wide">Tally Pro</h1>
        </div>
        <div class="flex items-center gap-1">
            
            <!-- Dynamic Timing Selector -->
            <div class="relative flex items-center bg-white/10 rounded-full hover:bg-white/20 transition-colors px-2 py-1 mr-1 shadow-inner" title="Set Auto-Add Speed">
                <span class="material-symbols-rounded text-[18px] mr-1 opacity-80">speed</span>
                <select id="timer-delay-select" class="bg-transparent text-white text-sm font-bold outline-none appearance-none cursor-pointer pr-5 relative z-10 w-[3ch]">
                    <option value="1000" class="text-gray-900 font-medium">1s</option>
                    <option value="2000" class="text-gray-900 font-medium">2s</option>
                    <option value="3000" class="text-gray-900 font-medium">3s</option>
                    <option value="4000" class="text-gray-900 font-medium">4s</option>
                    <option value="5000" class="text-gray-900 font-medium" selected>5s</option>
                    <option value="10000" class="text-gray-900 font-medium">10s</option>
                </select>
                <span class="material-symbols-rounded text-[16px] absolute right-1.5 pointer-events-none opacity-80">arrow_drop_down</span>
            </div>

            <button id="toggle-auto-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition-colors flex items-center justify-center" title="Toggle Auto-Add">
                <span class="material-symbols-rounded" id="auto-icon">timer</span>
            </button>
            <button id="export-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition-colors flex items-center justify-center disabled:opacity-50" title="Export CSV">
                <span class="material-symbols-rounded">download</span>
            </button>
            <button id="clear-btn" class="p-2 rounded-full hover:bg-white/10 active:bg-white/20 transition-colors flex items-center justify-center disabled:opacity-50" title="Clear All Marks">
                <span class="material-symbols-rounded">delete_sweep</span>
            </button>
            <button id="full-reset-btn" class="p-2 rounded-full hover:bg-error/80 active:bg-error transition-colors flex items-center justify-center" title="Full App Reset">
                <span class="material-symbols-rounded">restart_alt</span>
            </button>
        </div>
    </header>

    <!-- Auto-Add Status Banner -->
    <div id="status-banner" class="bg-primary-dark text-white text-xs py-1 px-4 text-center font-medium shadow-inner transition-all duration-300 h-6 overflow-hidden">
        Auto-add is enabled (5 seconds)
    </div>

    <!-- Sticky Grand Total Card -->
    <div class="bg-surface px-5 py-4 shadow-sm z-10 shrink-0 flex justify-between items-center border-b border-gray-200">
        <div>
            <p class="text-xs font-bold text-gray-500 uppercase tracking-widest" id="paper-count">Papers: 0</p>
            <p class="text-sm font-medium text-gray-600 mt-1">Grand Total</p>
        </div>
        <div class="text-4xl font-bold text-primary" id="grand-total">
            0
        </div>
    </div>

    <!-- Scrollable List Area -->
    <main id="list-container" class="flex-1 overflow-y-auto p-4 space-y-3 pb-24">
        <!-- Empty State -->
        <div id="empty-state" class="h-full flex flex-col items-center justify-center text-gray-400">
            <span class="material-symbols-rounded text-6xl mb-2 opacity-50">post_add</span>
            <p class="text-center font-medium">No marks yet.<br/>Type below to start.</p>
        </div>
        <!-- Entries will be injected here -->
    </main>

    <!-- Bottom Input Area (Material Surface) -->
    <footer class="bg-surface shadow-[0_-4px_16px_rgba(0,0,0,0.08)] z-20 shrink-0 relative pb-safe">
        
        <!-- Timer Progress Indicator -->
        <div class="absolute top-0 left-0 w-full h-1 bg-gray-200 overflow-hidden">
            <div id="timer-bar" class="h-full bg-secondary w-0 origin-left"></div>
        </div>

        <div class="p-4 flex gap-3 max-w-md mx-auto items-center">
            <div class="relative flex-1">
                <input
                    id="mark-input"
                    type="number"
                    inputmode="decimal"
                    placeholder="Enter mark..."
                    class="w-full bg-gray-100 border-none rounded-t-md px-4 py-4 text-2xl font-bold text-gray-800 focus:bg-gray-200 focus:outline-none focus:ring-0 border-b-2 border-transparent focus:border-primary transition-colors"
                />
            </div>
            
            <!-- Material FAB (Floating Action Button) -->
            <button 
                id="add-btn"
                class="bg-primary text-white rounded-2xl w-14 h-14 flex items-center justify-center shadow-md active:shadow-sm active:translate-y-[1px] disabled:opacity-50 disabled:bg-gray-400 transition-all ripple"
                disabled
            >
                <span class="material-symbols-rounded text-3xl">add</span>
            </button>
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        // --- State ---
        let entries = [];
        let autoAddEnabled = true;
        let autoAddTimeout = null;
        let autoAddDelay = 5000; // Default to 5 seconds
        let editingId = null;

        // --- DOM Elements ---
        const input = document.getElementById('mark-input');
        const addBtn = document.getElementById('add-btn');
        const listContainer = document.getElementById('list-container');
        const emptyState = document.getElementById('empty-state');
        const grandTotalEl = document.getElementById('grand-total');
        const paperCountEl = document.getElementById('paper-count');
        const timerBar = document.getElementById('timer-bar');
        const toggleAutoBtn = document.getElementById('toggle-auto-btn');
        const timerDelaySelect = document.getElementById('timer-delay-select');
        const autoIcon = document.getElementById('auto-icon');
        const statusBanner = document.getElementById('status-banner');
        const exportBtn = document.getElementById('export-btn');
        const clearBtn = document.getElementById('clear-btn');
        const fullResetBtn = document.getElementById('full-reset-btn');

        // --- Initialization ---
        input.focus();

        // --- Event Listeners ---
        input.addEventListener('input', handleInput);
        input.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                addMark();
            }
        });
        
        addBtn.addEventListener('click', addMark);
        toggleAutoBtn.addEventListener('click', toggleAutoAdd);
        clearBtn.addEventListener('click', clearAll);
        exportBtn.addEventListener('click', exportCSV);
        fullResetBtn.addEventListener('click', fullReset);
        
        // Listen for user changing the delay timer speed
        timerDelaySelect.addEventListener('change', (e) => {
            autoAddDelay = parseInt(e.target.value);
            updateBannerText();
            
            // If currently typing, restart timer with new delay immediately
            if (autoAddEnabled && input.value.trim() !== '') {
                clearAutoTimer();
                startAutoTimer();
            }
            input.focus();
        });

        // --- Core Functions ---

        function updateBannerText() {
            if (autoAddEnabled) {
                statusBanner.innerText = `Auto-add is enabled (${autoAddDelay / 1000} seconds)`;
            } else {
                statusBanner.innerText = 'Auto-add is paused';
            }
        }

        function handleInput(e) {
            const val = e.target.value.trim();
            addBtn.disabled = val === '';

            // Reset Timer whenever user types
            clearAutoTimer();

            if (val !== '' && autoAddEnabled) {
                startAutoTimer();
            }
        }

        function startAutoTimer() {
            // Reset CSS animation
            timerBar.style.transition = 'none';
            timerBar.style.width = '100%';
            
            // Force browser reflow to restart animation seamlessly
            void timerBar.offsetWidth; 
            
            // Set dynamic transition duration based on user selection
            timerBar.style.transition = `width ${autoAddDelay}ms linear`;
            timerBar.style.width = '0%';

            // Start Countdown
            autoAddTimeout = setTimeout(() => {
                if (input.value.trim() !== '') {
                    addMark();
                }
            }, autoAddDelay);
        }

        function clearAutoTimer() {
            if (autoAddTimeout) {
                clearTimeout(autoAddTimeout);
                autoAddTimeout = null;
            }
            timerBar.style.transition = 'none';
            timerBar.style.width = '0%';
        }

        function toggleAutoAdd() {
            autoAddEnabled = !autoAddEnabled;
            
            if (autoAddEnabled) {
                autoIcon.innerText = 'timer';
                autoIcon.classList.remove('opacity-50');
                statusBanner.classList.remove('bg-gray-600', 'h-0', 'py-0');
                statusBanner.classList.add('bg-primary-dark', 'h-6', 'py-1');
                updateBannerText();
                
                // If there's text in input, start timer immediately
                if (input.value.trim() !== '') startAutoTimer();
            } else {
                autoIcon.innerText = 'timer_off';
                autoIcon.classList.add('opacity-50');
                statusBanner.classList.remove('bg-primary-dark');
                statusBanner.classList.add('bg-gray-600');
                updateBannerText();
                
                // Hide banner after 2 seconds
                setTimeout(() => {
                    if(!autoAddEnabled) {
                        statusBanner.classList.add('h-0', 'py-0');
                    }
                }, 2000);

                clearAutoTimer();
            }
            input.focus();
        }

        function addMark() {
            const markValue = parseFloat(input.value);
            
            if (!isNaN(markValue)) {
                entries.push({
                    id: Date.now(),
                    number: entries.length + 1,
                    mark: markValue
                });
                
                input.value = '';
                addBtn.disabled = true;
                clearAutoTimer();
                renderList();
            }
            input.focus();
        }

        function deleteEntry(id) {
            entries = entries.filter(e => e.id !== id);
            // Re-index entries to keep numbers sequential
            entries.forEach((e, index) => {
                e.number = index + 1;
            });
            renderList();
            input.focus();
        }

        function clearAll() {
            if (entries.length === 0) return;
            if (confirm("Clear all marks? This cannot be undone.")) {
                entries = [];
                input.value = '';
                addBtn.disabled = true;
                clearAutoTimer();
                renderList();
            }
            input.focus();
        }

        function fullReset() {
            if (confirm("Perform a full reset? This will clear all marks and restore default settings.")) {
                // Clear marks
                entries = [];
                input.value = '';
                addBtn.disabled = true;
                clearAutoTimer();
                
                // Reset settings to default
                autoAddDelay = 5000;
                timerDelaySelect.value = "5000";
                
                // Re-enable auto add if it was disabled
                if (!autoAddEnabled) {
                    toggleAutoAdd(); // This toggles it back to true and updates the UI
                } else {
                    updateBannerText();
                }
                
                renderList();
            }
            input.focus();
        }

        function exportCSV() {
            if (entries.length === 0) return;

            const total = entries.reduce((sum, e) => sum + e.mark, 0);
            let csvContent = "data:text/csv;charset=utf-8,Entry Number,Mark\n";
            entries.forEach(e => { csvContent += `${e.number},${e.mark}\n`; });
            csvContent += `\nTotal,${total}`;

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "tally_pro_material.csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        // --- Inline Editing Functions ---
        function startEditing(id, currentMark) {
            editingId = id;
            renderList();
        }

        function saveEdit(id, newValue) {
            const markValue = parseFloat(newValue);
            if (!isNaN(markValue)) {
                const entry = entries.find(e => e.id === id);
                if(entry) entry.mark = markValue;
            }
            editingId = null;
            renderList();
            input.focus();
        }

        function cancelEdit() {
            editingId = null;
            renderList();
            input.focus();
        }

        // --- Rendering ---
        function renderList() {
            // Update Totals
            const total = entries.reduce((sum, e) => sum + e.mark, 0);
            grandTotalEl.innerText = total % 1 !== 0 ? total.toFixed(2) : total;
            paperCountEl.innerText = `Papers: ${entries.length}`;
            
            // Update Header Buttons
            exportBtn.disabled = entries.length === 0;
            clearBtn.disabled = entries.length === 0;

            // Clear current list
            listContainer.innerHTML = '';

            if (entries.length === 0) {
                listContainer.appendChild(emptyState);
                emptyState.classList.remove('hidden');
                return;
            } else {
                emptyState.classList.add('hidden');
            }

            // Render items
            entries.forEach(entry => {
                const itemDiv = document.createElement('div');
                
                if (editingId === entry.id) {
                    // Edit Mode UI
                    itemDiv.className = "flex items-center justify-between p-2 rounded-xl bg-indigo-50 border border-primary shadow-sm";
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-3 flex-1">
                            <span class="text-xs font-bold text-primary w-6">#${entry.number}</span>
                            <input 
                                type="number" 
                                inputmode="decimal"
                                value="${entry.mark}" 
                                id="edit-input-${entry.id}"
                                class="w-full bg-white border border-gray-300 rounded-lg px-3 py-2 text-xl font-bold text-gray-800 focus:ring-2 focus:ring-primary outline-none"
                            >
                        </div>
                        <div class="flex items-center gap-1 ml-2">
                            <button onclick="saveEdit(${entry.id}, document.getElementById('edit-input-${entry.id}').value)" class="p-2 text-green-600 hover:bg-green-100 rounded-lg transition-colors">
                                <span class="material-symbols-rounded">check</span>
                            </button>
                            <button onclick="cancelEdit()" class="p-2 text-gray-400 hover:bg-gray-200 rounded-lg transition-colors">
                                <span class="material-symbols-rounded">close</span>
                            </button>
                        </div>
                    `;
                    
                    // Auto focus and handle enter/escape for edit field
                    setTimeout(() => {
                        const editInput = document.getElementById(`edit-input-${entry.id}`);
                        editInput.focus();
                        editInput.select();
                        editInput.addEventListener('keydown', (e) => {
                            if (e.key === 'Enter') saveEdit(entry.id, editInput.value);
                            if (e.key === 'Escape') cancelEdit();
                        });
                    }, 10);

                } else {
                    // Normal Mode UI
                    itemDiv.className = "flex items-center justify-between p-3 rounded-xl bg-surface border border-gray-100 shadow-sm transition-all";
                    itemDiv.innerHTML = `
                        <div class="flex items-center gap-4">
                            <span class="text-xs font-bold text-gray-400 w-6">#${entry.number}</span>
                            <span class="text-xl font-bold text-gray-800">${entry.mark}</span>
                        </div>
                        <div class="flex items-center">
                            <button onclick="startEditing(${entry.id}, ${entry.mark})" class="p-2 text-gray-400 hover:text-primary rounded-lg transition-colors">
                                <span class="material-symbols-rounded text-[20px]">edit</span>
                            </button>
                            <button onclick="deleteEntry(${entry.id})" class="p-2 text-gray-400 hover:text-error rounded-lg transition-colors">
                                <span class="material-symbols-rounded text-[20px]">delete</span>
                            </button>
                        </div>
                    `;
                }
                
                listContainer.appendChild(itemDiv);
            });

            // Auto-scroll to bottom smoothly
            listContainer.scrollTo({
                top: listContainer.scrollHeight,
                behavior: 'smooth'
            });
        }
    </script>
</body>
</html>
